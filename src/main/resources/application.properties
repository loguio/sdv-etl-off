spring.application.name=etl-off

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:etloff;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Hibernate JDBC Batching Optimization for Inserts
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Enable Java 21 Virtual Threads for Web MVC and Task Execution
spring.threads.virtual.enabled=true

# Logger config
logging.level.org.hibernate.SQL=WARN
logging.level.com.example.etloff=INFO
